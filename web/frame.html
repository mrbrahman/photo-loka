<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
  
  <title>Rewind, Replay</title>
  <link rel="icon" type="image/x-icon" href="assets/R3-resized.png">

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@shoelace-style/shoelace@2.15.1/cdn/themes/light.css" />
  <script data-shoelace="https://cdn.jsdelivr.net/npm/@shoelace-style/shoelace@2.15.1/cdn/"></script>
  <style>
      body {
        /* position: relative; */
        background-color: black;
        width: 100vw;
        height: 100svh;
        overflow: hidden;
        margin: 0px;
        padding: 0px;
      }
  </style>
  <template id="PL-SLIDE">
    <style>
      #container {
        position: relative;
        width: 100vw;
        height: 100svh;
      }

      #albumname {
        position: absolute;
        top: 10px;
        left: 10px;
        color: white;
      }

      #media {
        height: 100svh;
        display: flex;
        justify-content: center;
        align-items: center;
      }

      #media :is(img, video) {
        max-width: 100vw;
        max-height: 100svh;
      }

      #zoom-controls {
        position: absolute;
        top: 20px;
        left: 20px;
        display: flex;
        flex-direction: column;
        gap: 5px;
      }

      #zoom-controls sl-icon-button {
        background: rgba(0, 0, 0, 0.5);
        border-radius: 50%;
        width: 40px;
        height: 40px;
      }

      #zoom-controls sl-icon-button::part(base) {
        color: white;
        border-radius: 50%;
      }

      @media (max-width: 768px) {
        #zoom-controls {
          display: none;
        }
      }

      #actions {
        position: absolute;
        top: 20px;
        right: 10px;
        display: flex;
        align-items: center;
      }

      #actions > * {
        padding-left: 5px;
      }

      sl-icon-button {
        font-size: 1.20rem;
      }

      sl-icon-button::part(base) {
        color: white;
      }

      .hidden {
        visibility: hidden;
      }

    </style>

    <div id="container">
      <div id="media"></div>
      <div id="albumname"></div>
      
      <div id="zoom-controls">
        <sl-icon-button id="zoom-in" name="plus-lg" label="Zoom In"></sl-icon-button>
        <sl-icon-button id="zoom-out" name="dash-lg" label="Zoom Out"></sl-icon-button>
      </div>
      
      <div id="actions">
        <sl-rating id="rating"></sl-rating>
        <sl-icon-button id="info" name="info-circle" disabled>Info</sl-icon-button>
        <sl-icon-button id="delete" name="trash-fill" disabled>Delete</sl-icon-button>
        <!-- <sl-icon-button name="download">Download</sl-icon-button> -->
        <sl-dropdown>
          <sl-icon-button slot="trigger" name="three-dots-vertical">More Options</sl-icon-button>
          <sl-menu>
            <sl-menu-item id="start-slideshow">
              Slideshow
              <sl-icon slot="suffix" src="assets/slideshow-2-svgrepo-com.svg"></sl-icon>
            </sl-menu-item>

            <sl-menu-item disabled>
              Download
              <sl-icon slot="suffix" name="download"></sl-icon>
            </sl-menu-item>
          </sl-menu>
        </sl-dropdown>

      </div>
    </div>
  </template>
</head>
<body>
  <script src="js/frame.mjs" type="module"></script>

</body>
