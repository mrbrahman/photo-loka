<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
  
  <title>Rewind, Replay</title>
  <link rel="icon" type="image/x-icon" href="assets/R3-resized.png">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#66b3ff">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="apple-touch-icon" href="assets/R3-resized.png">

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@shoelace-style/shoelace@2.15.1/cdn/themes/light.css" />
  <!-- <script type="module" src="https://cdn.jsdelivr.net/npm/@shoelace-style/shoelace@2.15.1/cdn/shoelace.js" ></script> -->
  <script data-shoelace="https://cdn.jsdelivr.net/npm/@shoelace-style/shoelace@2.15.1/cdn/"></script>

  <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&family=Roboto:wght@400;700&display=block" rel="stylesheet">

  <!-- For some reason (leaflet bug?) need leaflet.css outside of the pl-map to display the 
       marker icons (marker-icon-2x.png) properly 
  -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

  <script src="js/main.mjs" type="module"></script>
  
  <style>
    :not(:defined) {
      visibility: hidden;
      opacity: 0;
    }

    :root {
      --sl-font-sans: 'Lato', sans-serif;
    }

    body, h1, h2, h3, h4, h5, h6 {
      font-family: Lato,-apple-system,system-ui,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    }
    
    body {
      overflow-x: hidden;
      overflow-y: hidden;
      margin: 0px;
      padding: 0px;
    }

    :root {
      --progress-bar-height: 4px;
    }

    #app {
      display: grid;
      grid-template-columns: 1fr;
      grid-template-rows: var(--progress-bar-height) 60px 1fr;
      height: 100svh; /* note the svh */
      width: 100vw;
    }

    sl-progress-bar {
      margin-top: 1px;
      --height: var(--progress-bar-height);
      --indicator-color: orange;
    }

    sl-progress-bar.hide {
      visibility: hidden;
    }

    #nav-header {
      display: flex;
      align-items: center;
      padding: 10px 0 10px 0;
      background-color: white;
    }
    #nav-header > .nav-item {
      padding: 0 10px 0 10px;
    }
    #nav-header > #nav-search-box {
      flex-grow: 1;
      height: 40px;
      border-radius: 20px;
      border: 1px solid darkgrey;
      font-size: medium;
      font-family: inherit;
    }
    #nav-header > #nav-title {
      font-weight: bold;
    }

    @media(max-width: 601px) {
      #nav-header > #nav-title {display: none}
    }

    #main-content {
      overflow-x: hidden;
      overflow-y: hidden;
      position: relative;
    }

  </style>

  <!-- many web component practices adapted from: https://dev.to/dannyengelman/web-component-102-the-5-lessons-after-learning-web-components-101-h9p -->

</head>
<body>
  <div id="app">
    <sl-progress-bar id="progress-bar" class="hide"></sl-progress-bar>

    <!-- Navigation Header -->
    <nav id="nav-header">
      <a class="nav-item" id="nav-logo" href="/" data-navigo>
        <img id="logo" src="assets/R3-resized.png" alt="Relive!">
      </a>

      <a class="nav-item" id="nav-title" href="/" data-navigo>
        Rewind, Replay & Relive!
      </a>

      <input class="nav-item" id="nav-search-box" type="search" placeholder="Search your memories..."/>

      <!-- <sl-input class="nav-item" id="nav-search-box" clearable pill type="search" enterkeyhint="search" placeholder="Search your memories...">
        <sl-icon name="search" slot="prefix"></sl-icon>
      </sl-input> -->

      <a class="nav-item" href="/map" data-navigo>
        <sl-icon-button name="geo-alt-fill" label="Map View"></sl-icon-button>
      </a>
      
      <a class="nav-item" href="/frames" data-navigo>
        <sl-icon-button name="display" label="Frames"></sl-icon-button>
      </a>
      
      <sl-icon-button class="nav-item" id="nav-settings" name="gear" label="Settings"></sl-icon-button>
    </nav>
    
    <!-- Placeholder for dynamic main content -->
    <main id="main-content"></main>

  </div>
  
  <!-- Leaflet JavaScript -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <!-- Leaflet MarkerCluster JavaScript -->
  <script src="https://unpkg.com/leaflet.markercluster@1.4.1/dist/leaflet.markercluster.js"></script>
  
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/sw.js');
    }
  </script>

</body>
</html>
