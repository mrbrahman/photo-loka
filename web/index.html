<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
  
  <title>Rewind, Replay</title>
  <link rel="icon" type="image/x-icon" href="assets/R3-resized.png">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#66b3ff">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="apple-touch-icon" href="assets/R3-resized.png">

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@shoelace-style/shoelace@2.15.1/cdn/themes/light.css" />
  <!-- <script type="module" src="https://cdn.jsdelivr.net/npm/@shoelace-style/shoelace@2.15.1/cdn/shoelace.js" ></script> -->
  <script data-shoelace="https://cdn.jsdelivr.net/npm/@shoelace-style/shoelace@2.15.1/cdn/"></script>

  <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&family=Roboto:wght@400;700&display=block" rel="stylesheet">

  <!-- For some reason (leaflet bug?) need leaflet.css outside of the pl-map to display the 
       marker icons (marker-icon-2x.png) properly 
  -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

  <script src="js/main.mjs" type="module"></script>
  
  <style>
    :not(:defined) {
      visibility: hidden;
      opacity: 0;
    }

    :root {
      --sl-font-sans: 'Lato', sans-serif;
    }

    body, h1, h2, h3, h4, h5, h6 {
      font-family: Lato,-apple-system,system-ui,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    }
    
    body {
      overflow-x: hidden;
      overflow-y: hidden;
      margin: 0px;
      padding: 0px;
    }

    :root {
      --progress-bar-height: 4px;
    }

    #app {
      display: grid;
      grid-template-columns: 1fr;
      grid-template-rows: var(--progress-bar-height) 60px 1fr;
      height: 100svh; /* note the svh */
      width: 100vw;
    }

    sl-progress-bar {
      margin-top: 1px;
      --height: var(--progress-bar-height);
      --indicator-color: orange;
    }

    sl-progress-bar.hide {
      visibility: hidden;
    }

    #nav-header {
      display: flex;
      align-items: center;
      padding: 10px 0 10px 0;
      background-color: white;
    }
    #nav-header > .nav-item {
      padding: 0 10px 0 10px;
    }
    #nav-header > #nav-search-box {
      flex-grow: 1;
      height: 40px;
      border-radius: 20px;
      border: 1px solid darkgrey;
      font-size: medium;
      font-family: inherit;
    }
    #nav-header > #nav-title {
      font-weight: bold;
    }

    @media(max-width: 601px) {
      #nav-header > #nav-title {display: none}
    }

    #main-content {
      overflow-x: hidden;
      overflow-y: hidden;
      position: relative;
    }

  </style>

  <!-- many web component practices adapted from: https://dev.to/dannyengelman/web-component-102-the-5-lessons-after-learning-web-components-101-h9p -->
  <template id='PL-ALBUM'>
    <style>
      #container {
        position: relative;
      }

      pl-album-name {
        margin: 0 0 0 4px;
        /* make it stick to the top as long as album is visible */
        position: sticky;
        top: 0px;
      }
      
      pl-thumb {
        position: absolute;
        top: 0px;
        left: 0px;
        transition: transform 0.3s;
      }

    </style>
    <div id="container">
    </div>
  </template>

  <template id="PL-ALBUM-NAME">
    <style>
      :host {
        /* height: 50px; */
        display: grid;
        grid-template-rows: 1fr;
        grid-template-columns: auto 1fr auto;
        /* grid-column-gap: 1px; */
        align-items: center;
        background-color: white;
        z-index: 1;
        /* "auto" does not transition yet 
          see 
          https://codepen.io/matuzo/post/animating-css-grid-layout-properties
          https://nemzes.net/posts/animating-height-auto/
          https://css-tricks.com/using-css-transitions-auto-dimensions/ and 
          https://n12v.com/css-transition-to-from-auto/
        
          however, for whatever reason, the max-width / grid-workaround also did not work here as expected 
          need to debug some other day. Until then there is no transition/animation :-/  
        */
        transition: all 0.3s;
      }
      
      #album-name {
        font-size: 0.95rem;
        /* color: rgb(60, 64, 67); */
        filter: blur(0.35px);
        margin: auto;
        padding: 0.5rem 0 0.5rem 0;
        
        /* overflow-y: scroll; */ 
        /* TODO: overflow does not work without height, and  
          specifying height is messing up with verticle alignment
        */
        margin: 0 5px 0 5px;
        border-radius: 5px;
      }

      #album-name:hover {
        cursor: text;
        background: #fafafa;
        outline: 2px solid #eee;
      }

      #album-name:focus {
        background: #efefef;
        outline: 2px solid green;
        transition: all 0.3s; /* want transition to happen only during focus, and not hover */
      }

      sl-icon {
        font-size: 1.5rem;
      }

      #select-all {
        /* visibility: hidden; */ /* cannot transition, hence showing always*/
        font-size: 1.5rem;
        transition: transform 0.3s;
        cursor: pointer;
      }

      .select-all {
        color: #66b3ff;
        transform: scale(1.5);
      }
      .select-some {
        color: grey;
        transform: scale(1.5);
      }
      .select-none {
        color: grey;
      }

      #edit-controls {
        visibility: hidden;
        cursor: pointer;
      }

      #save {
        color: #35b035;
      }
      #cancel {
        color: grey;
        margin-right: 5px;
      }

    </style>

    <!-- tooltip is sticking badly on mobile -->
    <!-- <sl-tooltip content="Toggle Select All" hoist> -->
      <sl-icon id="select-all" class="select-none" name="check-circle"></sl-icon>
    <!-- </sl-tooltip> -->

    <div id="album-name" contenteditable role="textbox" spellcheck="false"></div>
    
    <div id="edit-controls">
      <sl-icon id="save" name="check-circle-fill"></sl-icon>
      <sl-icon id="cancel" name="x-circle"></sl-icon>
    </div>
  </template>

  <template id="PL-GALLERY">
    <style>
      #gallery {
        position: relative;
        overflow-y: scroll;
        height: 100%;
      }

      pl-album {
        width: 100%;
        position: absolute;
        transition: top 0.3s;
      }

    </style>
    <div id="gallery"></div>
  </template>

  <template id="PL-GALLERY-CONTROLS">
    <style>
      :host {
        position: absolute;
        top: 2px;
        left: 5px;
        right: 5px;
        z-index: 1;
      }
      
      #container {
        display: grid;
        height: 65px;
        grid-template-rows: 1fr;
        grid-template-columns: auto 1fr;
        align-items: center;
        box-shadow: 0 0 5px #333;
        border-radius: 5px;
        background-color: white;
      }

      .col {
        display: flex;
        flex-wrap: nowrap;
        align-items: center;
      }
      #col1 {
        justify-content: flex-start;
      }
      #col2 {
        justify-content: flex-end;
      }
      #col1 > * {
        padding-right: 2px;
        padding-left: 2px;
      }
      #col2 > * {
        padding-right: 2px;
        padding-left: 2px;
      }

      sl-rating {
        --symbol-size: 1.25rem;
      }

      sl-icon-button {
        font-size: 1.25rem;
      }
      
    </style>

    <div id="container">
      <div class="col" id="col1">
        <sl-icon-button name="x-lg" id="close"></sl-icon-button>
        <div id="ctr"></div>
      </div>
      
      <div class="col" id="col2">
        <sl-rating id="rating"></sl-rating>
        <sl-icon-button id="add-keywords" name="tags-fill" disabled>Keywords</sl-icon-button>
        <sl-icon-button id="delete" name="trash-fill">Delete</sl-icon-button>
        <sl-icon-button id="organize" name="folder-plus">Organize</sl-icon-button>
        
        <!-- rest actions from the dropdown -->
        <sl-dropdown>
          <sl-icon-button name="three-dots-vertical" slot="trigger"></sl-icon-button>
          <sl-menu style="max-width: 200px;">
            <sl-menu-item>
              Share
              <sl-icon slot="suffix" name="share-fill"></sl-icon>
            </sl-menu-item>            
            <sl-menu-item>
              Update location
              <sl-icon slot="suffix" name="geo-alt-fill"></sl-icon>
            </sl-menu-item>
          </sl-menu>
        </sl-dropdown>
      </div>
    </div>

    <sl-dialog label="Create/Move-to New Album">
      <sl-input></sl-input>
      <sl-button id="save" slot="footer" variant="primary">Save</sl-button>
      <sl-button id="cancel" slot="footer" variant="primary">Cancel</sl-button>
    </sl-dialog>
  </template>

  <template id="PL-SLIDESHOW">
    <style>
      :host {
        position: absolute;
        top: 0px;
        left: 0px;
      }

      #container {
        position: relative;
        background-color: black;
        width: 100vw;
        height: 100svh;
        overflow: hidden;
      }

      sl-icon-button {
        font-size: 1.5rem;
      }

      sl-icon-button::part(base) {
        color: white;
      }

      #prev {
        position: absolute;
        top: 50%;
        left: 10px;
      }

      #next {
        position: absolute;
        top: 50%;
        right: 10px;
      }

      #close {
        position: absolute;
        bottom: 0px;
        left: 10px;
      }

      #slides > * {
        position: absolute;
        top: 0px;
        left: 0px;
        transition: transform 0.2s;
      }
      
      #slides > .active {
        transform: translate(0px, 0px);
        visibility: visible;
      }

      #slides > .left {
        left: 0px;
        transform: translate(-120vw, 0px);
        visibility: hidden;
      }

      #slides > .right {
        left: 0px;
        transform: translate(120vw, 0px);
        visibility: hidden;
      }

      #navigation {
        transition: visibility 0.2s;
      }

    </style>

    <div id="container">
      <div id="slides" >
      </div>

      <div id="navigation">
        <sl-icon-button id="prev" name="chevron-left"></sl-icon-button>
        <sl-icon-button id="next" name="chevron-right"></sl-icon-button>
        <sl-icon-button id="close" name="x"></sl-icon-button>
      </div>

    </div>

  </template>

  <template id="PL-CAROUSEL">
    <style>
      :host {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        background: transparent;
        pointer-events: none;
        z-index: 1000;
      }
      #container {
        position: absolute;
        background: white;
        border-radius: 8px;
        padding: 10px;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
        border: 1px solid #ccc;
        pointer-events: auto;
      }
      #carousel-wrapper {
        position: relative;
        overflow: hidden;
        width: 100%;
        height: 190px;
        margin-top: 30px;
      }
      #carousel-track {
        transition: transform 0.3s ease;
        height: 100%;
      }
      pl-thumb {
        position: absolute;
      }
      .nav-button {
        position: absolute;
        top: 50%;
        transform: translateY(-50%);
        background: rgba(0, 0, 0, 0.5);
        color: white;
        border: none;
        width: 40px;
        height: 40px;
        border-radius: 50%;
        cursor: pointer;
        font-size: 18px;
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 10;
      }
      .nav-button:hover {
        background: rgba(0, 0, 0, 0.7);
      }
      #prev-btn {
        left: 10px;
        display: none;
      }
      #next-btn {
        right: 10px;
        display: none;
      }
      #close-btn {
        position: absolute;
        top: 10px;
        right: 10px;
        background: none;
        border: none;
        font-size: 24px;
        cursor: pointer;
        color: #666;
      }
      #close-btn:hover {
        color: #000;
      }
    </style>
    <div id="container">
      <button id="close-btn">&times;</button>
      <div id="carousel-wrapper">
        <div id="carousel-track"></div>
        <button id="prev-btn" class="nav-button">&lt;</button>
        <button id="next-btn" class="nav-button">&gt;</button>
      </div>
    </div>
  </template>

  <template id="PL-FRAME-ITEM">
    <style>
      :host {
        display: block;
        font-family: 'Lato', sans-serif;
      }
      sl-input::part(input)::placeholder {
        color: var(--sl-color-neutral-400);
        opacity: 1;
      }
      .frame-row {
        margin-bottom: 0.75rem;
        border: 1px solid var(--sl-color-neutral-200);
        border-radius: var(--sl-border-radius-medium);
        background: white;
      }
      .row-summary {
        display: flex;
        justify-content: space-between;
        align-items: center;
        width: 100%;
        padding-right: 1rem;
      }
      .info-group {
        text-align: left;
      }
      .status-group {
        display: flex;
        align-items: center;
        gap: 0.5rem;
      }
      .title {
        font-weight: bold;
        font-size: 1.125rem;
        color: var(--sl-color-neutral-900);
      }
      .subtitle {
        font-family: Consolas, var(--sl-font-mono);
        font-size: 0.875rem;
        color: var(--sl-color-neutral-500);
      }
      .edit-form {
        display: grid;
        grid-template-columns: 1fr;
        gap: 1rem;
        padding: 1rem;
        border-top: 1px solid var(--sl-color-neutral-100);
      }
      @media (min-width: 500px) {
        .edit-form {
          grid-template-columns: 1fr 1fr;
        }
      }
      .full-width {
        grid-column: 1 / -1;
      }
      .preview-section {
        margin-top: 1rem;
        padding-top: 1rem;
        border-top: 1px solid var(--sl-color-neutral-200);
      }
      .preview-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 1rem;
      }
      .preview-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
        gap: 0.5rem;
      }
      .preview-item {
        aspect-ratio: 1;
        background: var(--sl-color-neutral-200);
        border-radius: 4px;
        overflow: hidden;
      }
      .preview-item img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
    </style>
    <sl-details class="frame-row">
      <div slot="summary" class="row-summary">
        <div class="info-group">
          <div class="title" id="title-display"></div>
          <div class="subtitle" id="ip-display"></div>
        </div>
        <div class="status-group">
          <sl-badge id="status-badge" pill></sl-badge>
          <sl-icon-button id="pause-btn" name="pause-circle" label="Pause" style="display: none;"></sl-icon-button>
          <sl-icon-button id="resume-btn" name="play-circle" label="Resume" style="display: none;"></sl-icon-button>
        </div>
      </div>

      <form class="edit-form" id="form">
        <sl-input id="name" name="frame_name" label="Frame Name" size="small" required></sl-input>
        <sl-input id="ip" name="frame_ip_addr" label="IP Address" size="small" required></sl-input>
        
        <sl-select id="collection" name="collection_id" label="Collection" size="small">
          <sl-option value="">All Collections</sl-option>
          <sl-option value="1">Family Pics</sl-option>
        </sl-select>
        
        <sl-select id="order" name="display_order" label="Display Order" size="small">
          <sl-option value="ASC">Date (Oldest First)</sl-option>
          <sl-option value="DESC">Date (Newest First)</sl-option>
          <sl-option value="RANDOM">Random</sl-option>
        </sl-select>
        
        <sl-input id="search" name="search_str" label="Search Query" size="small" class="full-width" required></sl-input>
        
        <sl-input id="pause" name="daily_pause_range" label="Daily Pause (HH:mm-HH:mm)" size="small" placeholder="22:00-06:00"></sl-input>
        <sl-input id="cron" name="reset_schedule" label="Reset Schedule (Cron)" size="small" placeholder="0 0 * * *"></sl-input>

        <div class="preview-section full-width">
          <div class="preview-header">
            <h4 style="margin: 0;">Preview</h4>
            <sl-button size="small" type="button" id="load-preview-btn">
              Load Preview
            </sl-button>
          </div>
          <div id="preview-grid" style="display: none;"></div>
        </div>

        <div class="full-width" style="display: flex; justify-content: flex-end; gap: 0.5rem; margin-top: 0.5rem;">
          <sl-button size="small" variant="danger" outline type="button" id="delete-btn">Delete</sl-button>
          <sl-button size="small" variant="primary" type="submit" id="save-btn">Save Changes</sl-button>
        </div>
      </form>
    </sl-details>
  </template>

  <template id="PL-FRAME-MANAGER">
    <style>
      :host {
        font-family: 'Lato', sans-serif;
        display: block;
        background: var(--sl-color-neutral-50);
        min-height: 100%;
        overflow-y: auto;
      }
      .app-container {
        max-width: 650px;
        margin: 0 auto;
        padding: 1rem;
      }
      .header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 1.5rem;
      }
      #frames-list {
        display: flex;
        flex-direction: column;
      }
    </style>
    <div class="app-container">
      <div class="header">
        <h2 style="margin:0">Display Frames</h2>
        <sl-button variant="primary" size="medium" id="new-frame-btn">
          <sl-icon slot="prefix" name="plus-lg"></sl-icon> New Frame
        </sl-button>
      </div>
      <div id="frames-list"></div>
    </div>
  </template>

</head>
<body>
  <div id="app">
    <sl-progress-bar id="progress-bar" class="hide"></sl-progress-bar>

    <!-- Navigation Header -->
    <nav id="nav-header">
      <a class="nav-item" id="nav-logo" href="/" data-navigo>
        <img id="logo" src="assets/R3-resized.png" alt="Relive!">
      </a>

      <a class="nav-item" id="nav-title" href="/" data-navigo>
        Rewind, Replay & Relive!
      </a>

      <input class="nav-item" id="nav-search-box" type="search" placeholder="Search your memories..."/>

      <!-- <sl-input class="nav-item" id="nav-search-box" clearable pill type="search" enterkeyhint="search" placeholder="Search your memories...">
        <sl-icon name="search" slot="prefix"></sl-icon>
      </sl-input> -->

      <a class="nav-item" href="/map" data-navigo>
        <sl-icon-button name="geo-alt-fill" label="Map View"></sl-icon-button>
      </a>
      
      <a class="nav-item" href="/frames" data-navigo>
        <sl-icon-button name="display" label="Frames"></sl-icon-button>
      </a>
      
      <sl-icon-button class="nav-item" id="nav-settings" name="gear" label="Settings"></sl-icon-button>
    </nav>
    
    <!-- Placeholder for dynamic main content -->
    <main id="main-content"></main>

  </div>
  
  <!-- Leaflet JavaScript -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <!-- Leaflet MarkerCluster JavaScript -->
  <script src="https://unpkg.com/leaflet.markercluster@1.4.1/dist/leaflet.markercluster.js"></script>
  
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/sw.js');
    }
  </script>

</body>
</html>
