<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
  
  <title>Rewind, Replay</title>
  <link rel="icon" type="image/x-icon" href="assets/R3-resized.png">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#66b3ff">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="apple-touch-icon" href="assets/R3-resized.png">

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@shoelace-style/shoelace@2.15.1/cdn/themes/light.css" />
  <script data-shoelace="https://cdn.jsdelivr.net/npm/@shoelace-style/shoelace@2.15.1/cdn/"></script>

  <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&family=Roboto:wght@400;700&display=block" rel="stylesheet">

  <!-- For some reason (leaflet bug?) need leaflet.css outside of the pl-map to display the 
       marker icons (marker-icon-2x.png) properly 
  -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

  <script src="js/main.mjs" type="module"></script>
  
  <style>
    :not(:defined) {
      visibility: hidden;
      opacity: 0;
    }

    :root {
      --sl-font-sans: 'Lato', sans-serif;
      --progress-bar-height: 4px;
    }

    body, h1, h2, h3, h4, h5, h6 {
      font-family: Lato,-apple-system,system-ui,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    }
    
    body {
      overflow: hidden;
      margin: 0;
      padding: 0;
    }

    /* Single source of truth for viewport sizing.
       Using dvh/dvw (dynamic viewport) so mobile browser chrome is accounted for.
       All children should use 100% to inherit from here. */
    #app-root {
      width: 100dvw;
      height: 100dvh;
    }
  </style>

  <!-- many web component practices adapted from: https://dev.to/dannyengelman/web-component-102-the-5-lessons-after-learning-web-components-101-h9p -->

</head>
<body>
  <!-- Router will inject pl-login-page or pl-app-shell here -->
  <div id="app-root"></div>
  
  <!-- Leaflet JavaScript -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <!-- Leaflet MarkerCluster JavaScript -->
  <script src="https://unpkg.com/leaflet.markercluster@1.4.1/dist/leaflet.markercluster.js"></script>
  
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/sw.js');
    }
  </script>
</body>
</html>
