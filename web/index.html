<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width">
  
  <title>Photo-Loka</title>
  <link rel="icon" type="image/x-icon" href="assets/icon-454.png">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#66b3ff">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="apple-touch-icon" href="assets/icon-454.png">

  <link rel="stylesheet" href="css/theme-vars.css" />
  <link id="sl-theme-light" rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@shoelace-style/shoelace@2.15.1/cdn/themes/light.css" />
  <link id="sl-theme-dark" rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@shoelace-style/shoelace@2.15.1/cdn/themes/dark.css" disabled />
  <script data-shoelace="https://cdn.jsdelivr.net/npm/@shoelace-style/shoelace@2.15.1/cdn/"></script>

  <!-- Early theme init to prevent flash of wrong theme -->
  <script>
    (function() {
      var t = localStorage.getItem('rr-theme') ||
              (matchMedia('(prefers-color-scheme:dark)').matches ? 'dark' : 'light');
      if (t === 'dark') {
        document.documentElement.setAttribute('data-theme', 'dark');
        document.documentElement.classList.add('sl-theme-dark');
        document.getElementById('sl-theme-light').disabled = true;
        document.getElementById('sl-theme-dark').disabled = false;
      }
    })();
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700;900&family=Roboto:wght@400;700&display=block" rel="stylesheet">

  <!-- For some reason (leaflet bug?) need leaflet.css outside of the pl-map to display the 
       marker icons (marker-icon-2x.png) properly 
  -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

  <script type="importmap">
  {
    "imports": {
      "shoelace/": "https://cdn.jsdelivr.net/npm/@shoelace-style/shoelace@2.15.1/cdn/",
      "navigo": "https://unpkg.com/navigo@8.11.1/lib/navigo.min.js",
      "cronstrue": "https://cdn.jsdelivr.net/npm/cronstrue@2.50.0/+esm",
      "leaflet-css": "https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    }
  }
  </script>

  <script src="js/main.mjs" type="module"></script>
  
  <style>
    :not(:defined) {
      visibility: hidden;
      opacity: 0;
    }

    :root {
      --sl-font-sans: 'Lato', sans-serif;
      --sl-font-size-medium: 0.9rem;
      --progress-bar-height: 4px;
    }

    body, h1, h2, h3, h4, h5, h6 {
      font-family: Lato,-apple-system,system-ui,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    }
    
    body {
      overflow: hidden;
      margin: 0;
      padding: 0;
    }

    /* Single source of truth for viewport sizing.
       Using dvh/dvw (dynamic viewport) so mobile browser chrome is accounted for.
       All children should use 100% to inherit from here. */
    #app-root {
      width: 100dvw;
      height: 100dvh;
    }
  </style>

  <!-- many web component practices adapted from: https://dev.to/dannyengelman/web-component-102-the-5-lessons-after-learning-web-components-101-h9p -->

</head>
<body>
  <!-- Router will inject pl-login-page or pl-app-shell here -->
  <div id="app-root"></div>
  
  <!-- Leaflet JavaScript
       Cannot be in import maps - these are classic scripts (not ES modules) that set window.L global.
       Import maps only apply to ES module imports. -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/leaflet.markercluster@1.4.1/dist/leaflet.markercluster.js"></script>
</body>
</html>
