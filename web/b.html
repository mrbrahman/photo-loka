<!-- Shoelace CDN Assets -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@shoelace-style/shoelace@2.15.1/cdn/themes/light.css" />
<script type="module" src="https://cdn.jsdelivr.net/npm/@shoelace-style/shoelace@2.15.1/cdn/shoelace.js" ></script>


<style>
  body { font-family: var(--sl-font-sans); background: var(--sl-color-neutral-50); padding: 1rem; }
  .app-container { max-width: 650px; margin: 0 auto; }
  .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem; }
  
  /* Row Styles */
  .frame-row { margin-bottom: 0.75rem; border: 1px solid var(--sl-color-neutral-200); border-radius: var(--sl-border-radius-medium); background: white; }
  .row-summary { display: flex; justify-content: space-between; align-items: center; width: 100%; padding-right: 1rem; }
  .info-group { text-align: left; }
  .title { font-weight: bold; font-size: 1rem; color: var(--sl-color-neutral-900); }
  .subtitle { font-family: var(--sl-font-mono); font-size: 0.8rem; color: var(--sl-color-neutral-500); }
  
  /* Form Layout */
  .edit-form { display: grid; grid-template-columns: 1fr; gap: 1rem; padding: 1rem; border-top: 1px solid var(--sl-color-neutral-100); }
  @media (min-width: 500px) { .edit-form { grid-template-columns: 1fr 1fr; } }
  .full-width { grid-column: 1 / -1; }
</style>

<div class="app-container">
  <div class="header">
    <h2 style="margin:0">Display Frames</h2>
    <sl-button variant="primary" size="medium" onclick="renderNewFrameForm()">
      <sl-icon slot="prefix" name="plus-lg"></sl-icon> New Frame
    </sl-button>
  </div>

  <div id="frame-list">
    <!-- Frames will be injected here -->
  </div>
</div>

<script>
  // 1. Initial Data (Mocking your SQLite rows)
  let frames = [
    { id: 1, name: "Hallway Tablet", ip: "192.168.1.102", search: "nature photos", order: "RANDOM", pause: "23:00-06:00", cron: "0 0 * * *" },
    { id: 2, name: "Living Room TV", ip: "192.168.1.105", search: "family 2024", order: "DESC", pause: "22:00-08:00", cron: "0 12 * * *" },
    { id: 3, name: "Office Frame", ip: "192.168.1.110", search: "space stars", order: "ASC", pause: "", cron: "" }
  ];

  // 2. Render Function
  function renderList() {
    const list = document.getElementById('frame-list');
    list.innerHTML = frames.map(f => createFrameHTML(f)).join('');
  }

  function createFrameHTML(f, isOpen = false) {
    return `
      <sl-details class="frame-row" ${isOpen ? 'open' : ''}>
        <div slot="summary" class="row-summary">
          <div class="info-group">
            <div class="title">${f.name || 'Unnamed Frame'}</div>
            <div class="subtitle">${f.ip || '0.0.0.0'}</div>
          </div>
          <sl-badge variant="${f.ip ? 'success' : 'neutral'}" pill>${f.ip ? 'Online' : 'Pending'}</sl-badge>
        </div>

        <form class="edit-form" onsubmit="handleSave(event, ${f.id})">
          <sl-input name="name" label="Frame Name" value="${f.name}" size="small" required></sl-input>
          <sl-input name="ip" label="IP Address" value="${f.ip}" size="small" required></sl-input>
          <sl-input name="search" label="Search String" value="${f.search}" size="small" class="full-width"></sl-input>
          
          <sl-select name="order" label="Display Order" value="${f.order}" size="small">
            <sl-option value="ASC">Date ASC</sl-option>
            <sl-option value="DESC">Date DESC</sl-option>
            <sl-option value="RANDOM">Random</sl-option>
          </sl-select>
          
          <sl-input name="pause" label="Daily Pause (HH:mm-HH:mm)" value="${f.pause}" size="small" placeholder="22:00-06:00"></sl-input>
          <sl-input name="cron" label="Reset Schedule (Cron)" value="${f.cron}" size="small" class="full-width"></sl-input>

          <div class="full-width" style="display: flex; justify-content: flex-end; gap: 0.5rem; margin-top: 0.5rem;">
            <sl-button size="small" variant="danger" outline onclick="deleteFrame(${f.id})">Delete</sl-button>
            <sl-button size="small" variant="primary" type="submit">Save Changes</sl-button>
          </div>
        </form>
      </sl-details>
    `;
  }

  // 3. Logic for "New" Button
  function renderNewFrameForm() {
    const list = document.getElementById('frame-list');
    const newId = Date.now(); // Temporary ID
    const emptyFrame = { id: newId, name: "", ip: "", search: "", order: "RANDOM", pause: "", cron: "" };
    
    // Prepend the new form to the top of the list
    const tempDiv = document.createElement('div');
    tempDiv.innerHTML = createFrameHTML(emptyFrame, true);
    list.prepend(tempDiv.firstElementChild);
    
    // Focus the first input of the new form
    setTimeout(() => {
      list.querySelector('sl-input[name="name"]').focus();
    }, 100);
  }

  // 4. Logic for "Save" (Simulating API update)
  async function handleSave(event, id) {
    event.preventDefault();
    const formData = new FormData(event.target);
    const updatedData = Object.fromEntries(formData.entries());
    
    // Visual feedback: show loading on the save button
    const btn = event.target.querySelector('sl-button[type="submit"]');
    btn.loading = true;

    console.log(`Saving ID ${id} to SQLite:`, updatedData);
    
    // Simulate network delay
    await new Promise(r => setTimeout(r, 600));
    
    btn.loading = false;
    notify("Frame saved successfully!", "success");
    
    // In a real app, you would fetch() to your backend here
    // and then re-render the list with the fresh data.
  }

  function notify(message, variant) {
    const alert = Object.assign(document.createElement('sl-alert'), { variant, closable: true, duration: 3000, 
      innerHTML: `<sl-icon slot="icon" name="check2-circle"></sl-icon> ${message}` });
    document.body.append(alert);
    return alert.toast();
  }

  // Initial load
  renderList();
</script>
