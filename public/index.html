<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
  
  <title>Rewind, Replay</title>
  <link rel="icon" type="image/x-icon" href="assets/R3-resized.png">

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@shoelace-style/shoelace@2.15.1/cdn/themes/light.css" />
  <script type="module" src="https://cdn.jsdelivr.net/npm/@shoelace-style/shoelace@2.15.1/cdn/shoelace.js" ></script>

  <style>
    body, h1, h2, h3, h4, h5, h6 {
      font-family: -apple-system,system-ui,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    }
    
    body {
      overflow-x: hidden;
      overflow-y: hidden;
      margin: 0px;
      padding: 0px;
    }

    :root {
      --progress-bar-height: 4px;
    }

    #app {
      display: grid;
      grid-template-columns: 1fr;
      grid-template-rows: var(--progress-bar-height) 60px 1fr;
      height: 100svh; /* note the svh */
      width: 100vw;
    }

    sl-progress-bar {
      margin-top: 1px;
      --height: var(--progress-bar-height);
      --indicator-color: orange;
    }

    sl-progress-bar.hide {
      visibility: hidden;
    }

    #nav-header {
      display: flex;
      align-items: center;
      padding: 10px 0 10px 0;
      background-color: white;
    }
    #nav-header > .nav-item {
      padding: 0 10px 0 10px;
    }
    #nav-header > #nav-search-box {
      flex-grow: 1;
      height: 40px;
      border-radius: 20px;
      border: 1px solid darkgrey;
      font-size: medium;
    }
    #nav-header > #nav-title {
      font-weight: bold;
    }

    @media(max-width: 601px) {
      #nav-header > #nav-title {display: none}
    }

    #main-content {
      overflow-x: hidden;
      overflow-y: hidden;
      position: relative;
    }

  </style>

  <!-- many web component practices adapted from: https://dev.to/dannyengelman/web-component-102-the-5-lessons-after-learning-web-components-101-h9p -->

  <template id='PL-THUMB'>
    <!-- checkbox css heavily borrowed from https://stackoverflow.com/a/30663705/8098748   -->
    <style>
      #container {
        position: relative;
        background-color: whitesmoke;
        /* height: 250px; */
        /* width: 400px; */
        /* display: block; */
        transition: all 0.3s ease-in-out;
      }

      img {
        /* position: absolute; */
        /* top: 0px; */
        /* left: 0px; */
        background-color: darkgrey;
        max-width: 100%;
        max-height: 100%;
        box-sizing: border-box;
        /* border: solid 0px; */
        transition: all 0.3s ease-in-out;
        /* transform-origin: 50% 50%; */
        /* display: block; */
        cursor: pointer;
        visibility: hidden;
      }
      
      img.ready {
        visibility: visible;
        animation: 0.4s lodingfeel cubic-bezier(1,0,1,.08);
      }
      @keyframes lodingfeel {
        from {
          filter: blur(15px);
        }
        to {
          filter: blur(0);
        }
      }
      
      sl-rating {
        position: absolute;
        visibility: hidden;
        top: 5px;
        right: 5px;
        --symbol-size: 1rem;
        --symbol-spacing: 1px;
      }

      sl-icon-button[name="trash"] {
        position: absolute;
        bottom: 5px;
        right: 5px;
        font-size: 1.5rem;
      }

      sl-icon-button[name="trash"]::part(base) {
        color: #dfdeda;
      }

      input[type="checkbox"] {
        display: none;
      }

      label:before {
        background-color: none;
        color: white;
        content: " ";
        display: block;
        border-radius: 50%;
        border: 3px solid grey;
        position: absolute;
        top: 5px;
        left: 5px;
        width: 25px;
        height: 25px;
        text-align: center;
        line-height: 28px;
        transition-duration: 0.3s;
        z-index: 1;
        pointer-events: auto;
        cursor: pointer;
        /*   transform: scale(0); */
      }

      /* :checked ~ img {
        border-color: #ddd;
      } */
      :checked + label:before {
        content: "✓";
        background-color: #66b3ff;
        transform: scale(1.5);
      }

      img:has(~ :checked) {
        transform: scale(0.85);
        box-shadow: 0 0 5px #333;
        z-index: -1;
      }
    </style>

    <div id="container">
      <!--  rest of the template is updated in the connectedCallback method -->
    </div>
    
  </template>

  <template id='PL-ALBUM'>
    <style>
      #container {
        position: relative;
      }

      pl-album-name {
        margin: 0 0 0 4px;
        /* make it stick to the top as long as album is visible */
        position: sticky;
        top: 0px;
      }
      
      pl-thumb {
        position: absolute;
        top: 0px;
        left: 0px;
        transition: transform 0.3s;
      }

    </style>
    <div id="container">
    </div>
  </template>

  <template id="PL-ALBUM-NAME">
    <style>
      :host {
        /* height: 50px; */
        display: grid;
        grid-template-rows: 1fr;
        grid-template-columns: auto 1fr auto;
        /* grid-column-gap: 1px; */
        align-items: center;
        background-color: white;
        z-index: 1;
        /* "auto" does not transition yet 
          see 
          https://codepen.io/matuzo/post/animating-css-grid-layout-properties
          https://nemzes.net/posts/animating-height-auto/
          https://css-tricks.com/using-css-transitions-auto-dimensions/ and 
          https://n12v.com/css-transition-to-from-auto/
        
          however, for whatever reason, the max-width / grid-workaround also did not work here as expected 
          need to debug some other day. Until then there is no transition/animation :-/  
        */
        transition: all 0.3s;
      }
      
      #album-name {
        font-size: 0.95rem;
        color: rgb(60, 64, 67);
        filter: blur(0.35px);
        margin: auto;
        padding: 0.5rem 0 0.5rem 0;
        
        /* overflow-y: scroll; */ 
        /* TODO: overflow does not work without height, and  
          specifying height is messing up with verticle alignment
        */
        margin: 0 5px 0 5px;
        border-radius: 5px;
      }

      #album-name:hover {
        cursor: text;
        background: #fafafa;
        outline: 2px solid #eee;
      }

      #album-name:focus {
        background: #efefef;
        outline: 2px solid green;
        transition: all 0.3s; /* want transition to happen only during focus, and not hover */
      }

      sl-icon {
        font-size: 1.5rem;
      }

      #select-all {
        /* visibility: hidden; */ /* cannot transition, hence showing always*/
        font-size: 1.5rem;
        transition: transform 0.3s;
        cursor: pointer;
      }

      .select-all {
        color: #66b3ff;
        transform: scale(1.5);
      }
      .select-some {
        color: grey;
        transform: scale(1.5);
      }
      .select-none {
        color: grey;
      }

      #edit-controls {
        visibility: hidden;
        cursor: pointer;
      }

      #save {
        color: #35b035;
      }
      #cancel {
        color: grey;
        margin-right: 5px;
      }

    </style>

    <!-- tooltip is sticking badly on mobile -->
    <!-- <sl-tooltip content="Toggle Select All" hoist> -->
      <sl-icon id="select-all" class="select-none" name="check-circle"></sl-icon>
    <!-- </sl-tooltip> -->

    <div id="album-name" contenteditable role="textbox" spellcheck="false"></div>
    
    <div id="edit-controls">
      <sl-icon id="save" name="check-circle-fill"></sl-icon>
      <sl-icon id="cancel" name="x-circle"></sl-icon>
    </div>
  </template>

  <template id="PL-GALLERY">
    <style>
      #gallery {
        position: relative;
        overflow-y: scroll;
        height: 100%;
      }

      pl-album {
        width: 100%;
        position: absolute;
        transition: top 0.3s;
      }

    </style>
    <div id="gallery"></div>
  </template>

  <template id="PL-GALLERY-CONTROLS">
    <style>
      :host {
        position: absolute;
        top: 2px;
        left: 5px;
        right: 5px;
        z-index: 1;
      }
      
      #container {
        display: grid;
        height: 65px;
        grid-template-rows: 1fr;
        grid-template-columns: auto 1fr;
        align-items: center;
        box-shadow: 0 0 5px #333;
        border-radius: 5px;
        background-color: white;
      }

      .col {
        display: flex;
        flex-wrap: nowrap;
        align-items: center;
      }
      #col1 {
        justify-content: flex-start;
      }
      #col2 {
        justify-content: flex-end;
      }
      #col1 > * {
        padding-right: 2px;
        padding-left: 2px;
      }
      #col2 > * {
        padding-right: 2px;
        padding-left: 2px;
      }

      sl-rating {
        --symbol-size: 1.25rem;
      }

      sl-icon-button {
        font-size: 1.25rem;
      }
      
    </style>

    <div id="container">
      <div class="col" id="col1">
        <sl-icon-button name="x-lg" id="close"></sl-icon-button>
        <div id="ctr"></div>
      </div>
      
      <div class="col" id="col2">
        <sl-rating id="rating"></sl-rating>
        <sl-icon-button name="tags-fill">Keywords</sl-icon-button>
        <sl-icon-button id="delete" name="trash-fill">Delete</sl-icon-button>
        <sl-icon-button name="file-code-fill">Organize</sl-icon-button>
        
        <!-- rest actions from the dropdown -->
        <sl-dropdown>
          <sl-icon-button name="three-dots-vertical" slot="trigger"></sl-icon-button>
          <sl-menu style="max-width: 200px;">
            <sl-menu-item>
              Share
              <sl-icon slot="suffix" name="share-fill"></sl-icon>
            </sl-menu-item>            
            <sl-menu-item>
              Update location
              <sl-icon slot="suffix" name="geo-alt-fill"></sl-icon>
            </sl-menu-item>
          </sl-menu>
        </sl-dropdown>
      </div>
    </div>
  </template>

  <template id="PL-SLIDESHOW">
    <style>
      :host {
        position: absolute;
        top: 0px;
        left: 0px;
      }

      #container {
        position: relative;
        background-color: black;
        width: 100vw;
        height: 100svh;
      }

      sl-icon-button {
        font-size: 1.5rem;
      }

      sl-icon-button::part(base) {
        color: white;
      }

      #prev {
        position: absolute;
        top: 50%;
        left: 10px;
      }

      #next {
        position: absolute;
        top: 50%;
        right: 10px;
      }

      #close {
        position: absolute;
        bottom: 0px;
        left: 10px;
      }

      #slides > * {
        position: absolute;
        top: 0px;
        left: 0px;
        transition: transform 0.2s;
      }
      
      #slides > .active {
        transform: translate(0px, 0px);
      }

      #slides > .left {
        left: 0px;
        transform: translate(-120vw, 0px);
      }

      #slides > .right {
        left: 0px;
        transform: translate(120vw, 0px);
      }

      #navigation {
        transition: visibility 0.2s;
      }

    </style>

    <div id="container">
      <div id="slides" >
      </div>

      <div id="navigation">
        <sl-icon-button id="prev" name="chevron-left"></sl-icon-button>
        <sl-icon-button id="next" name="chevron-right"></sl-icon-button>
        <sl-icon-button id="close" name="x"></sl-icon-button>
      </div>

    </div>

  </template>

  <template id="PL-SLIDE">
    <style>
      #container {
        position: relative;
        width: 100vw;
        height: 100svh;
      }

      #albumname {
        position: absolute;
        top: 10px;
        left: 10px;
        color: white;
      }

      #media {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        color: white;
      }

      #actions {
        position: absolute;
        top: 20px;
        right: 10px;
        display: flex;
        align-items: center;
      }

      #actions > * {
        padding-left: 5px;
      }

      sl-icon-button {
        font-size: 1.20rem;
      }

      sl-icon-button::part(base) {
        color: white;
      }

      .hidden {
        visibility: hidden;
      }

    </style>

    <div id="container">
      <div id="media"></div>
      <div id="albumname"></div>
      <div id="actions">
        <sl-rating id="rating"></sl-rating>
        <sl-icon-button id="info" name="info-circle">Info</sl-icon-button>
        <sl-icon-button id="delete" name="trash-fill">Delete</sl-icon-button>
        <!-- <sl-icon-button name="download">Download</sl-icon-button> -->
        <sl-dropdown>
          <sl-icon-button slot="trigger" name="three-dots-vertical">More Options</sl-icon-button>
          <sl-menu>
            <sl-menu-item id="start-slideshow">
              Slideshow
              <sl-icon slot="suffix" src="assets/slideshow-2-svgrepo-com.svg"></sl-icon>
            </sl-menu-item>

            <sl-menu-item>
              Download
              <sl-icon slot="suffix" name="download"></sl-icon>
            </sl-menu-item>
          </sl-menu>
        </sl-dropdown>

      </div>
    </div>
  </template>

</head>
<body>
  <div id="app">
    <sl-progress-bar id="progress-bar" class="hide"></sl-progress-bar>

    <!-- Navigation Header -->
    <nav id="nav-header">
      <a class="nav-item" id="nav-logo" href="/" data-navigo>
        <img id="logo" src="assets/R3-resized.png" alt="Relive!">
      </a>

      <a class="nav-item" id="nav-title" href="/" data-navigo>
        Rewind, Replay & Relive!
      </a>

      <input class="nav-item" id="nav-search-box" type="search" placeholder="Search your memories..."/>

      <!-- <sl-input class="nav-item" id="nav-search-box" clearable pill type="search" enterkeyhint="search" placeholder="Search your memories...">
        <sl-icon name="search" slot="prefix"></sl-icon>
      </sl-input> -->

      <sl-icon-button class="nav-item" id="nav-settings" name="gear" label="Settings"></sl-icon-button>
    </nav>
    
    <!-- Placeholder for dynamic main content -->
    <main id="main-content"></main>

  </div>
  <script src="js/main.mjs" type="module"></script>

</body>
</html>
