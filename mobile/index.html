<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, viewport-fit=cover">

  <title>Photo-Loka</title>
  <link rel="icon" type="image/x-icon" href="assets/icon-454.png">
  <meta name="theme-color" content="#66b3ff">

  <!-- All assets are local (vendored at build time). No CDN: a packaged app
       must not depend on reaching the internet to render. -->
  <link rel="stylesheet" href="css/theme-vars.css" />
  <link id="sl-theme-light" rel="stylesheet" href="vendor/shoelace/light.css" />
  <link id="sl-theme-dark" rel="stylesheet" href="vendor/shoelace/dark.css" disabled />

  <!-- Early theme init to prevent flash of wrong theme -->
  <script>
    (function() {
      var t = localStorage.getItem('rr-theme') ||
              (matchMedia('(prefers-color-scheme:dark)').matches ? 'dark' : 'light');
      if (t === 'dark') {
        document.documentElement.setAttribute('data-theme', 'dark');
        document.documentElement.classList.add('sl-theme-dark');
        document.getElementById('sl-theme-light').disabled = true;
        document.getElementById('sl-theme-dark').disabled = false;
      }
    })();
  </script>

  <!-- Leaflet CSS (local). pl-map also imports leaflet-css as a CSS module for
       its shadow DOM; this top-level link is for marker icon positioning. -->
  <link rel="stylesheet" href="vendor/leaflet.css" />

  <style>
    :not(:defined) { visibility: hidden; opacity: 0; }

    /* Lato, vendored locally (no CDN). Weights 400/700/900 match what the web
       build requests from Google Fonts; 500/600 are synthesized. Declarations
       mirror @fontsource/lato (latin + latin-ext subsets per weight, with its
       unicode-ranges). display:swap avoids invisible text while loading.

       KNOWN LIMITATION -- Lato 900 does not render in the Android System
       WebView (it falls back to the system bold). 400 and 700 render correctly
       and cover essentially all text. Root cause: @fontsource ships Lato as
       per-weight STATIC files; the WebView reads the 900 file's internal
       (OS/2) weight metadata as ~normal and therefore refuses to use it for a
       `font-weight: 900` request, even though the @font-face below declares it
       as 900 and the file loads fine (`document.fonts.check("900 16px Lato")`
       returns true, but glyphs still fall back). The usual fix -- a variable
       font whose wght axis covers 900 -- is unavailable: Lato has no variable
       build on @fontsource. We chose NOT to work around it (a mobile-only
       family alias would mean forking web/ CSS, against the thin-shell rule).

       WHERE THIS SHOWS: the only `font-weight: 900` usage is the "Photo-Loka"
       wordmark -- web/js/components/styles/pl-app-shell.css (#nav-title) and
       pl-login-page.css (h1.brand). Those render in the system bold on the app;
       everything else is real Lato. If Lato ever ships a variable build, drop
       the static 900 faces for it and this resolves. */
    @font-face {
      font-family: 'Lato'; font-style: normal; font-weight: 400; font-display: swap;
      src: url('fonts/lato-latin-400.woff2') format('woff2');
      unicode-range: U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD;
    }
    @font-face {
      font-family: 'Lato'; font-style: normal; font-weight: 400; font-display: swap;
      src: url('fonts/lato-latin-ext-400.woff2') format('woff2');
      unicode-range: U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF;
    }
    @font-face {
      font-family: 'Lato'; font-style: normal; font-weight: 700; font-display: swap;
      src: url('fonts/lato-latin-700.woff2') format('woff2');
      unicode-range: U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD;
    }
    @font-face {
      font-family: 'Lato'; font-style: normal; font-weight: 700; font-display: swap;
      src: url('fonts/lato-latin-ext-700.woff2') format('woff2');
      unicode-range: U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF;
    }
    @font-face {
      font-family: 'Lato'; font-style: normal; font-weight: 900; font-display: swap;
      src: url('fonts/lato-latin-900.woff2') format('woff2');
      unicode-range: U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD;
    }
    @font-face {
      font-family: 'Lato'; font-style: normal; font-weight: 900; font-display: swap;
      src: url('fonts/lato-latin-ext-900.woff2') format('woff2');
      unicode-range: U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF;
    }

    :root {
      --sl-font-sans: 'Lato', -apple-system, system-ui, 'Segoe UI', Roboto, sans-serif;
      --sl-font-size-medium: 0.9rem;
      --progress-bar-height: 4px;
    }
    body, h1, h2, h3, h4, h5, h6 {
      font-family: Lato,-apple-system,system-ui,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    }
    body { overflow: hidden; margin: 0; padding: 0; }

    /* Shoelace toasts (notify()) mount a position:fixed .sl-toast-stack on
       document.body at top:0, outside #app-root, so #app-root's safe-area
       padding does not affect them and they overlap the status bar on mobile.
       position:fixed can only be corrected by moving the element itself, so
       offset the stack by the top inset here (global, light-DOM rule). */
    .sl-toast-stack {
      top: env(safe-area-inset-top) !important;
    }
    /* Offset content by the device safe-area insets (status bar at top, gesture
       bar at bottom, notch cutouts at the sides). The WebView draws edge-to-edge
       because of viewport-fit=cover, so without this the app header renders under
       the status bar and its top buttons become unclickable. border-box keeps the
       total box at 100dvw/100dvh while the padding reserves the inset space. */
    #app-root {
      box-sizing: border-box;
      width: 100dvw;
      height: 100dvh;
      padding-top: env(safe-area-inset-top);
      padding-bottom: env(safe-area-inset-bottom);
      padding-left: env(safe-area-inset-left);
      padding-right: env(safe-area-inset-right);
    }
  </style>

  <!-- Mobile bootstrap (bundled, includes @capacitor/* and all frontend deps).
       Decides between the server-setup intake screen and booting the app; sets
       window.__API_BASE__ before dynamically importing js/main.mjs. -->
  <script type="module">
    import { boot } from './js/mobile-boot.mjs';
    document.addEventListener('DOMContentLoaded', boot);
  </script>
</head>
<body>
  <div id="app-root"></div>

  <!-- Leaflet as local global scripts (classic, non-module): pl-map uses the
       window.L global and markercluster plugs into it. Local, not CDN. -->
  <script src="vendor/leaflet.js"></script>
  <script src="vendor/leaflet.markercluster.js"></script>
</body>
</html>
